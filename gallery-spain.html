<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея — Чемпіонат Світу | Boar Fight Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .achievements-card:first-child .achievements-media {
            background-image: url('https://i.postimg.cc/HkCHJ3Kh/IMG-1130.avif');
            background-size: cover;
            background-position: center;
        }

        :root {
            --bg-color: #121212;
            --card-bg: #1c1c1c;
            --border-color: #333333;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            flex-grow: 1;
            width: 100%;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 15px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .gallery-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: #666;
        }

        .gallery-item a {
            display: block;
            position: relative;
        }

        .gallery-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
            transition: opacity 0.2s;
        }

        .gallery-item a:hover .gallery-img {
            opacity: 0.9;
        }

        .gallery-info {
            padding: 15px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        footer {
            background: #080808;
            padding: 25px 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: #777;
            font-size: 13px;
            margin-top: 60px;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Назад на сайт</a>
        <div style="font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 14px;">Boar Fight Club</div>
    </header>

    <div class="gallery-container">
        <h1>Фотогалерея <span>команди</span></h1>
        <p class="subtitle">Чемпіонат Світу ІСКА в Іспанії — яскраві моменти та світові перемоги</p>

        <div class="gallery-grid">
            <div class="gallery-item">
                <a href="https://i.postimg.cc/xC3yc1Pj/photo-2026-11-06-09-10-11.jpg" target="_blank">
                    <img src="https://i.postimg.cc/xC3yc1Pj/photo-2026-11-06-09-10-11.jpg" alt="Чемпіонат Світу Іспанія" class="gallery-img">
                </a>
                <div class="gallery-info">Збірна команди в Іспанії</div>
            </div>

            <div class="gallery-item">
              <a href="prizers-spain.html">
                  <img src="https://i.postimg.cc/Zqfqfkj5/IMG-1130.avif" alt="Чемпіонат Світу Іспанія" class="gallery-img">
                  <div class="gallery-info">Наші призери</div>
              </a>
          </div>

            <div class="gallery-item">
                <a href="https://i.postimg.cc/Qdp5YPZ3/photo-2026-11-08-19-38-05.jpg0" target="_blank">
                    <img src="https://i.postimg.cc/Qdp5YPZ3/photo-2026-11-08-19-38-05.jpg" alt="Чемпіонат Світу Іспанія" class="gallery-img">
                </a>
                <div class="gallery-info">Спільне фото</div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Boar Fight Club. Всі права захищені.</p>
    </footer>

</body>
</html>
